[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "ecommerce-ml-analytics"
version = "0.1.0"
description = "E-commerce funnel analytics and purchase propensity research"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["duckdb>=1.1,<2", "pandas>=2.2,<4", "scikit-learn>=1.5,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/ecommerce_analytics"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
