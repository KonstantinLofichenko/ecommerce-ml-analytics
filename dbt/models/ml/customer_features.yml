  - name: first_purchase_month
    description: See docs/customer-features-v4.md for definitions and clock limitations.
    data_tests:
    - not_null
  - name: target_30d
    description: See docs/customer-features-v4.md for definitions and clock limitations.
    data_tests:
    - not_null
    - accepted_values:
        arguments:
