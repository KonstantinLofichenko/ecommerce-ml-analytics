ecommerce_analytics:
  target: dev
  outputs:
    dev:
      type: clickhouse
      schema: "{{ env_var('CLICKHOUSE_DATABASE', 'ecommerce') }}"
      host: "{{ env_var('CLICKHOUSE_HOST', 'clickhouse') }}"
      port: "{{ env_var('CLICKHOUSE_PORT', '8123') | int }}"
      user: "{{ env_var('CLICKHOUSE_USER', 'ecommerce_app') }}"
      password: "{{ env_var('CLICKHOUSE_PASSWORD') }}"
      secure: false
      threads: 2
    catalog:
      type: clickhouse
      schema: "{{ env_var('CLICKHOUSE_DATABASE', 'synerise_analytics') }}"
      host: "{{ env_var('CLICKHOUSE_HOST', 'clickhouse') }}"
      port: "{{ env_var('CLICKHOUSE_PORT', '8123') | int }}"
      user: "{{ env_var('CLICKHOUSE_USER', 'ecommerce_app') }}"
      password: "{{ env_var('CLICKHOUSE_PASSWORD') }}"
      secure: false
      threads: 1
      custom_settings:
        max_threads: 1
        max_block_size: 8192
        max_memory_usage: 1073741824
        max_bytes_before_external_sort: 33554432
        max_bytes_before_external_group_by: 67108864
        min_bytes_to_use_direct_io: 1
